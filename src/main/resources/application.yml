server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://api.deepseek.com
  model: deepseek-v4-flash

# 语义检索服务（RAG 检索端，独立 Python 服务）
# 若未启动或不可用，Agent 商品搜索会自动降级回退到 MySQL 关键词搜索，不影响主流程
semantic:
  search:
    base-url: http://localhost:8000
    enabled: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_trade?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

admin:
  phone: admin
  password: Admin@123456

jwt:
  secret: campus-trade-jwt-secret-key-2026-very-long-string!!
  expire-days: 7

file:
  upload-dir: C:/Users/29153/Desktop/UniTrade/Uni-trade/uploads

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
